# Generated project is a sandbox engineering target, not an upload approval.
# XcodeGen 2.46: https://github.com/yonaskolb/XcodeGen/blob/2.46.0/Docs/ProjectSpec.md
name: NestPlayer
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_HARDENED_RUNTIME: YES
targets:
  NestPlayer:
    type: application
    platform: macOS
    sources:
      - path: Sources/NestPlayer
      - path: .build/StoreResources/Assets.xcassets
        buildPhase: resources
      - path: .build/StoreResources/NestCastService.app
        type: folder
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
      - path: .build/StoreResources/PYTHON-LICENSE.txt
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: AppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: AppStore/Info.plist
        PRODUCT_NAME: Nest Player
        ARCHS: arm64
        PRODUCT_MODULE_NAME: NestPlayer
        PRODUCT_BUNDLE_IDENTIFIER: dev.htlin.nest-player
        EXECUTABLE_NAME: NestPlayer
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: AppStore/NestPlayer.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
        SKIP_INSTALL: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.htlin.nest-player.sandbox-development
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE DEBUG"
schemes:
  NestPlayerStore:
    build:
      targets:
        NestPlayer: all
    run:
      config: Debug
    archive:
      config: Release
